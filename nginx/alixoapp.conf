# Doublure serveur (T-11, T-13, T-14) : à utiliser si le site vitrine quitte GitHub Pages pour un serveur Nginx.
# Reprend les blocages du Worker Cloudflare au cas où le CDN serait contourné, et n'accepte que les IP de Cloudflare (T-12).
map $http_user_agent $alixo_bad_ua {
    default 0;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|Claude-SearchBot|anthropic-ai|Google-Extended|Applebot-Extended|CCBot|PerplexityBot|Perplexity-User|Bytespider|Meta-ExternalAgent|Meta-ExternalFetcher|Amazonbot|cohere-ai|Diffbot|YouBot|omgili|ImagesiftBot) 1;
    ~*(python-requests|python-urllib|aiohttp|httpx|^curl/|^Wget|Scrapy|HeadlessChrome|Go-http-client|axios|node-fetch) 1;
    "" 1;
}
limit_req_zone $binary_remote_addr zone=alixo_pages:10m rate=30r/m;

server {
    listen 443 ssl http2;
    server_name alixoapp.com www.alixoapp.com;
    root /var/www/alixoapp;
    server_tokens off;                                   # T-13
    more_clear_headers Server X-Powered-By;              # (module headers-more)
    add_header TDM-Reservation "1" always;               # T-02
    add_header X-Robots-Tag "noai, noimageai" always;    # T-03
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    autoindex off;                                       # T-14

    # T-12 : seules les plages IP de Cloudflare (https://www.cloudflare.com/ips/) — à inclure et tenir à jour
    include /etc/nginx/cloudflare-allow.conf;
    deny all;
    real_ip_header CF-Connecting-IP;

    if ($alixo_bad_ua) { return 403; }                   # T-06 / T-11
    location ~ /\.(git|env|svn) { return 404; }          # T-14
    location ~* \.(bak|old|sql|zip|tar|gz)$ { return 404; }
    location /piege/ { access_log /var/log/nginx/piege.log; return 403; }   # T-15 : fail2ban lit ce journal
    location ~* \.(html)$|/$ { limit_req zone=alixo_pages burst=20 nodelay; try_files $uri $uri/index.html =404; }   # T-09
    location ~ ^/(mentions-legales|contact)\.html$ { add_header X-Robots-Tag "noindex, nofollow, noai, noimageai" always; if ($http_accept !~* "text/html") { return 403; } }
}
