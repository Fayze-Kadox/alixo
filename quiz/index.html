<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rejoindre un quiz — Alixo</title>
<meta name="description" content="Entrez le code affiché par le présentateur pour rejoindre un quiz Alixo en direct et répondre depuis votre téléphone.">
<meta name="robots" content="noindex, nofollow, noai, noimageai">
<meta name="tdm-reservation" content="1">
<meta name="theme-color" content="#1b1f3a">
<link rel="canonical" href="https://alixoapp.com/quiz/">
<link rel="icon" type="image/png" href="/img/logo.png">
<!-- alixoapp.com/quiz : adresse courte affichée sur l'écran du présentateur (et dans le QR code, avec ?code=…).
     La page des participants vit avec l'application : /docs/quiz.html. On y envoie tout de suite, code compris. -->
<script>(function(){try{location.replace('/docs/quiz.html'+location.search+location.hash);}catch(e){}})();</script>
<meta http-equiv="refresh" content="0; url=/docs/quiz.html">
<style>
  html { background: #1b1f3a; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: #fff; background: radial-gradient(900px 600px at 20% -10%, #3b2a7a 0%, transparent 60%), linear-gradient(160deg, #1b1f3a, #2d1b4e); text-align: center; padding: 24px; }
  .box { max-width: 420px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: rgba(255, 255, 255, .72); line-height: 1.5; margin: 0 0 18px; }
  a.btn { display: inline-block; padding: 14px 26px; border-radius: 12px; background: #ffb64d; color: #1b1f3a; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
  <div class="box">
    <h1>Rejoindre un quiz</h1>
    <p>Ouverture de la page des participants…</p>
    <a class="btn" id="go" href="/docs/quiz.html">Continuer</a>
  </div>
  <script>(function(){var a=document.getElementById('go');if(a)a.href='/docs/quiz.html'+location.search+location.hash;})();</script>
</body>
</html>
